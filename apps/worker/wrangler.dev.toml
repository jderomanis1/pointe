# S10.i.c2 — dev/CI wrangler config. Selected by the `dev:e2e` script
# (`wrangler dev -c wrangler.dev.toml --port 8787 --ip 127.0.0.1 --local`).
# The dev entry keeps the gated test routes while exercising the same
# planning-poker API and Durable Object used in production.

name = "pointe-worker"
main = "src/worker.dev.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RetroRoom"]

[[migrations]]
tag = "v3"
deleted_classes = ["RetroRoom"]

[[kv_namespaces]]
binding = "POINTE_SLUGS"
id = "kv_local_dev"

[vars]
POINTE_E2E_TOKEN = "dev-e2e-token"
RL_CREATE_PER_HOUR_OVERRIDE = "500"
