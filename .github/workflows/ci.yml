name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run worker tests
        run: pnpm -F @pointe/worker test

      - name: Run web tests
        id: web-tests
        shell: bash
        run: |
          set +e
          pnpm -F @pointe/web test > /tmp/pointe-web-tests.log 2>&1
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report web test failure
        if: steps.web-tests.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            echo '### Temporary CI diagnostic'
            echo
            echo '```text'
            tail -n 160 /tmp/pointe-web-tests.log
            echo '```'
          } > /tmp/pointe-web-tests-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/pointe-web-tests-comment.md
          exit 1
