name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run worker tests
        shell: bash
        run: |
          set +e
          pnpm -F @pointe/worker test > worker-tests.log 2>&1
          status=$?
          cat worker-tests.log
          exit $status

      - name: Upload worker test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-test-diagnostics
          path: worker-tests.log
          if-no-files-found: ignore

      - name: Run web tests
        run: pnpm -F @pointe/web test
